name: Tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep this name stable: branch protection requires this exact status check.
    name: solder.py tests
    # PR and merge-queue code can be untrusted, so it stays off the persistent runner.
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    env:
      PIPENV_DONT_LOAD_ENV: "1"
      PIPENV_NOSPIN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: Pipfile
          cache: pipenv

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Verify lock file
        run: pipenv verify

      - name: Install locked dependencies
        run: pipenv sync

      - name: Check installed dependencies
        run: pipenv run python -m pip check

      - name: Compile Python sources
        run: pipenv run python -m compileall -q app.py api.py alogin.py asetup.py asite.py audit_dependencies.py models tests

      - name: Run test suite
        run: pipenv run python -m unittest discover -s tests -v
