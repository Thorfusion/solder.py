name: Dependency review

on:
  pull_request:
    paths:
      - Pipfile
      - Pipfile.lock
      - Dockerfile
      - .github/workflows/**

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check dependency changes
        uses: actions/dependency-review-action@v5
