name: Python security

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Keep this name stable if it is selected as a required status check.
    name: Python security
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    env:
      PIPENV_DONT_LOAD_ENV: "1"
      PIPENV_NOSPIN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: Pipfile
          cache: pipenv

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install locked security tools
        run: pipenv sync --dev

      - name: Audit production dependencies
        run: pipenv run python audit_dependencies.py

      - name: Scan Python source
        run: pipenv run bandit --recursive app.py api.py alogin.py asetup.py asite.py models --severity-level medium --confidence-level medium
