name: Container security

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep this name stable if it is selected as a required status check.
    name: Container security
    # Manual runs are trusted and use the local Docker cache on the self-hosted runner.
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: solderpy:security-${{ github.sha }}

      - name: Smoke test running container
        run: python tests/container_smoke.py solderpy:security-${{ github.sha }}

      - name: Test current and migrated MySQL databases
        run: python tests/database_container_smoke.py solderpy:security-${{ github.sha }}

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: solderpy:security-${{ github.sha }}
          version: v0.74.0
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true

      - name: Upload scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: solderpy-container
