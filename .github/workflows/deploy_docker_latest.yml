name: Deploy latest image

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  select-runner:
    name: Select an available runner
    uses: ./.github/workflows/select-runner.yml
    permissions:
      actions: write
      contents: read

  push_to_registry:
    name: Push latest image to Docker Hub
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          # Rerun apk upgrade even when the floating base tag has not changed.
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          tags: thorfusion/solderpy:latest
