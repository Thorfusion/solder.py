version: 2
updates:
  # Keep routine updates together; major upgrades remain separate for review.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Europe/Oslo
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Oslo
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Oslo
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - patch

  # Browser libraries in static/ are updated manually, together with package.json.
