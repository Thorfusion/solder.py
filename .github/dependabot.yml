version: 2
updates:
  # Python updates are grouped, tested, and proposed by update_dependencies.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Oslo
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Oslo
    groups:
      docker:
        patterns:
          - "*"
